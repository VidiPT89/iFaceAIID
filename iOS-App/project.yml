name: iFaceAIID
options:
  bundleIdPrefix: dev.ividi
packages:
  SharedKit:
    path: ../SharedKit
targets:
  iFaceAIID:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - Sources
    info:
      path: Info.plist
      properties:
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.ividi.faceaiid
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - package: SharedKit
